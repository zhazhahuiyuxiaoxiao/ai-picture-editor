schema: spec-driven

context: |
  项目：AI 修图智能体个人副本。
  基线提交：49f6ad8c96740a68b7e6228a47e8e2be6876eb34，核对日期 2026-10-29。
  当前任务只补录已有行为与工程文档；事实来源为 docs/engineering-baseline.md 所列源码。
  保留上游作者及许可，不声称快照历史或未经验证的生产能力。
  不读写真实凭据、运行数据库、私有配置或用户上传资源。
rules:
  proposal:
    - 区分已实现现状、未来建议和待确认业务取舍。
    - 说明范围、影响与不变行为；权限、数据和跨仓契约变化须先确认。
  specs:
    - 使用 SHALL 或 MUST 和 WHEN/THEN 场景；写明源码证据与失败边界。
  tasks:
    - 分别记录文档校验、业务验证及尚未运行的检查，禁止虚报通过。
